# Sitio estático en Render (demo de UI, sin backend)
services:
  - type: web
    runtime: static
    name: memoria-viva
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/ui/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # Rutas del SPA: cualquier URL sirve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /ngsw-worker.js
        name: Cache-Control
        value: no-cache
